[pytest]
testpaths = .
markers =
    contract_v1: Test covers a v1.0 contract requirement
    winbot: Test applies only to WinBot
    winebot: Test applies only to WineBot
    vnext_portable_core_candidate: Provisional vNext portable-core candidate; classification evidence only, not frozen authority
    vnext_capability_extension_candidate: Provisional vNext capability-qualified extension candidate; does not imply capability is claimed
    vnext_implementation_specific: Implementation-specific behavior that is not portable vNext conformance
    vnext_obsolete_contract: Legacy v1 compatibility assertion proposed for retirement from vNext shared semantics
    vnext_unresolved: vNext classification remains unresolved; do not create compatibility shims solely to satisfy this assertion
addopts = -v --tb=short --strict-markers
