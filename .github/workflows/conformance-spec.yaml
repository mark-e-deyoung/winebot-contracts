# Validates the OpenAPI spec and ensures the conformance suite remains
# importable/collectable without requiring a live WineBot or WinBot target.
# Live conformance execution is handled separately by run-conformance.yaml.

name: Spec Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install openapi-spec-validator pyyaml pytest requests
      - name: Validate OpenAPI spec
        run: |
          python -c "
import yaml
from openapi_spec_validator import validate
with open('api/openapi.yaml') as f:
    spec = yaml.safe_load(f)
validate(spec)
print('OpenAPI spec is valid')
"
      - name: Collect conformance suite offline
        run: |
          pytest tests/conformance --collect-only -q
